[project]
name = "flappit-backend"
version = "0.1.0"
description = "Flappit API — free-form travel planning backend"
requires-python = ">=3.9"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Database (async)
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Settings / validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",

    # Redis
    "redis[hiredis]>=5.0.0",

    # HTTP client (for map / embed proxying)
    "httpx>=0.27.0",

    # AI
    "openai>=1.55.0",

    # Python 3.9 compatibility — makes X | Y union syntax work at runtime
    "eval_type_backport>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",   # TestClient uses httpx
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

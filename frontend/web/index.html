<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Flappit</title>

    <!-- Leaflet CSS — required for map tiles and markers to render correctly -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; }

      /* TipTap / ProseMirror editor styles */
      .flappit-editor { flex: 1; overflow-y: auto; }
      .ProseMirror {
        outline: none;
        font-size: 16px;
        line-height: 1.6;
        color: #1a1a1a;
        padding: 16px 20px;
        min-height: 300px;
      }
      .ProseMirror p.is-editor-empty:first-child::before {
        color: #bbb;
        content: attr(data-placeholder);
        float: left;
        height: 0;
        pointer-events: none;
      }
      .ProseMirror h1 { font-size: 24px; font-weight: 700; margin: 16px 0 8px; }
      .ProseMirror h2 { font-size: 20px; font-weight: 700; margin: 14px 0 6px; }
      .ProseMirror h3 { font-size: 17px; font-weight: 600; margin: 12px 0 4px; }
      .ProseMirror ul, .ProseMirror ol { padding-left: 24px; margin: 8px 0; }
      .ProseMirror li { margin: 4px 0; }
      .ProseMirror blockquote {
        border-left: 3px solid #3B82F6;
        margin: 8px 0;
        padding-left: 12px;
        color: #666;
      }
      .ProseMirror code {
        background: #f4f4f4;
        border-radius: 4px;
        padding: 2px 4px;
        font-family: monospace;
        font-size: 14px;
      }
      .ProseMirror pre {
        background: #f4f4f4;
        border-radius: 8px;
        padding: 12px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
